<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Arcane Quest – Reset</title><style>html,body{margin:0;min-height:100%;background:#120e18;color:#f7f0e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:24px}.box b{display:block;margin-bottom:8px}.box small{color:#b8a9c4}</style></head><body><div class="box"><b>Spielstand wird zurückgesetzt …</b><small>Bitte einen Moment warten.</small></div><script>(async()=>{window.__ARCANE_INTENTIONAL_RESET=true;const purge=()=>{try{localStorage.clear();sessionStorage.clear()}catch(e){console.warn('[Reset] storage',e)}};purge();try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}}catch(e){console.warn('[Reset] pwa',e)}purge();location.replace('./?fresh=1&reset='+Date.now())})()</script></body></html>
