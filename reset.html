<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Arcane Quest – Reset</title><style>html,body{margin:0;min-height:100%;background:#120e18;color:#f7f0e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:24px}.box b{display:block;margin-bottom:8px}.box small{color:#b8a9c4}</style></head><body><div class="box"><b>Spielstand wird zurückgesetzt …</b><small>Bitte einen Moment warten.</small></div><script>(()=>{window.__ARCANE_INTENTIONAL_RESET=true;const target='./?newCharacter=1&reset='+Date.now();const purge=()=>{try{localStorage.clear();sessionStorage.clear()}catch(e){console.warn('[Reset] storage',e)}};purge();try{localStorage.removeItem('arcaneBeta');localStorage.removeItem('arcaneBetaBackup');localStorage.removeItem('arcaneCharacterCreated');localStorage.removeItem('arcaneLast')}catch{}let done=false;const go=()=>{if(done)return;done=true;purge();location.replace(target)};setTimeout(go,350);try{if('caches'in window)caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.unregister()))).catch(()=>{})}catch{}setTimeout(go,50)})()</script></body></html>
