name: Rebuild game icons v2

on:
  push:
    paths:
      - 'tools/rebuild_game_icons.py'
      - '.github/workflows/rebuild-game-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pillow numpy
      - run: python tools/rebuild_game_icons.py
      - name: Commit generated WebP icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/game-v2/*.webp
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "Generate transparent full-frame game icons v2"
            git push
          fi
