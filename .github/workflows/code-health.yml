name: Code Health

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Validate runtime graph and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = [src.split('?', 1)[0] for src in re.findall(r'<script\s+src="([^"]+)"', html)]
          missing = [src for src in scripts if not Path(src).is_file()]
          duplicates = sorted({src for src in scripts if scripts.count(src) > 1})
          if missing:
              raise SystemExit('Missing runtime files: ' + ', '.join(missing))
          if duplicates:
              raise SystemExit('Duplicate runtime references: ' + ', '.join(duplicates))

          forbidden = {
              'forge-v4.js', 'tavern-view-v5.js', 'tavern-polish-v6.js',
              'passive-runtime-fix-v2.js', 'compact-ui-v1.js',
              'ui-polish-v2.js', 'icon-polish-v1.js', 'merchant-bank-v2.js',
              'arena-render-fix-v1.js', 'arena-view-repair-v1.js',
              'hero-tutorial-bridge-v1.js', 'hero-skill-visibility-v1.js',
          }
          stale = sorted(forbidden.intersection(scripts))
          if stale:
              raise SystemExit('Obsolete runtime references still loaded: ' + ', '.join(stale))

          loaded = [Path(src) for src in scripts]
          placeholders = [str(path) for path in loaded if path.read_text(encoding='utf-8').strip() in {'PLACEHOLDER', 'TODO', 'TBD'}]
          if placeholders:
              raise SystemExit('Placeholder runtime files: ' + ', '.join(placeholders))

          asset_pattern = re.compile(r"assets/[A-Za-z0-9_./\-]+\.(?:webp|png|jpe?g|gif|svg)", re.I)
          asset_missing = set()
          for path in loaded + [Path('manifest.webmanifest')]:
              text = path.read_text(encoding='utf-8')
              for ref in asset_pattern.findall(text):
                  if not (root / ref).is_file():
                      asset_missing.add(f'{path}: {ref}')
          if asset_missing:
              raise SystemExit('Missing referenced assets:\n' + '\n'.join(sorted(asset_missing)))

          positions = {name: i for i, name in enumerate(scripts)}
          required_order = [
              ('core-runtime-v1.js', 'state-runtime-v1.js'),
              ('core-runtime-v1.js', 'design-system-v1.js'),
              ('core-runtime-v1.js', 'tavern.js'),
              ('core-runtime-v1.js', 'dungeon-v7.js'),
              ('core-runtime-v1.js', 'forge-v5.js'),
              ('asset-runtime-v1.js', 'catacomb-presentation-v1.js'),
              ('quest-cost-runtime-v1.js', 'quest-system-v1.js'),
              ('quest-system-v1.js', 'tavern.js'),
              ('forge-v5.js', 'forge-affix-v1.js'),
              ('arena-system-v1.js', 'arena-v2.js'),
              ('arena-v2.js', 'arena-ux-v3.js'),
              ('hero-layout-v7.js', 'hero-dashboard-v8.js'),
              ('content-variation-v1.js', 'interaction-stability-v1.js'),
          ]
          bad_order = [f'{a} must load before {b}' for a, b in required_order if a in positions and b in positions and positions[a] > positions[b]]
          if bad_order:
              raise SystemExit('Invalid runtime order: ' + '; '.join(bad_order))

          authority_violations = []
          for path in loaded:
              if path.name == 'core-runtime-v1.js':
                  continue
              text = path.read_text(encoding='utf-8')
              if re.search(r'window\.render\s*=', text):
                  authority_violations.append(f'{path}: replaces window.render')
              if re.search(r'window\.tab\s*=', text):
                  authority_violations.append(f'{path}: replaces window.tab')
          if authority_violations:
              raise SystemExit('Runtime authority violations:\n' + '\n'.join(authority_violations))

          print(f'Validated {len(scripts)} runtime references, ordering, authority and static assets.')
          PY

      - name: Validate single build version source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          release = Path('release-runtime-v1.js').read_text(encoding='utf-8')
          app_version = Path('app-version-v1.js').read_text(encoding='utf-8')
          runtime = re.search(r"const BUILD='(v\d+\.\d+\.\d+)'", release)
          if not runtime:
              raise SystemExit('release-runtime-v1.js must define the canonical semantic BUILD version.')
          if 'window.ARCANE_BUILD' not in app_version:
              raise SystemExit('app-version-v1.js must consume window.ARCANE_BUILD.')
          if not re.search(r'<meta name="build"(?: content="([^"]*)")?', html):
              raise SystemExit('index.html must keep a build meta element for runtime publication.')
          print('Canonical build source:', runtime.group(1), 'from release-runtime-v1.js')
          PY

      - name: Guard critical public APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'core-runtime-v1.js': ['window.render', 'window.tab', 'root.on', 'root.emit'],
              'state-runtime-v1.js': ['window.save', 'window.ARCANE_STATE'],
              'quest-cost-runtime-v1.js': ['window.getEffectiveQuestCost'],
              'quest-system-v1.js': ['window.qStart', 'window.qSelect', 'setSelected'],
              'tavern.js': ['window.home', 'window.tavern'],
              'dungeon-v7.js': ['window.dungeonV1', 'window.d1Start', 'window.d7Leave'],
              'forge-v5.js': ['window.forgeView', 'window.fv4Upgrade', 'window.fv4Legendary'],
              'arena-v2.js': ['window.arena', 'window.Arcane.views.arena', 'av2-resource'],
              'merchant-v3.js': ['window.merchantView', 'window.merchantBuy', 'window.merchantSell'],
              'hero-dashboard-v8.js': ['hd8-dashboard', 'hc1-summary', 'data-item-id', 'hero-inventory-tab'],
              'interaction-stability-v1.js': ['window.qSelect', 'window.arenaV2Stance'],
          }
          missing=[]
          for file, needles in checks.items():
              text=Path(file).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      missing.append(f'{file}: {needle}')
          if missing:
              raise SystemExit('Critical API regression:\n' + '\n'.join(missing))
          print('Critical public APIs are present.')
          PY

      - name: Guard release runtime ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[src.split('?',1)[0] for src in re.findall(r'<script\s+src="([^"]+)"',html)]
          failures=[]
          owners={
              'arena':['arena-v2.js'],
              'hero-dashboard':['hero-dashboard-v8.js'],
              'reincarnation':['reincarnation-v1.js','shrine-runtime-v2.js'],
          }
          for name,required in owners.items():
              for file in required:
                  if file not in scripts:
                      failures.append(f'{name}: missing owner {file}')
          for obsolete in ['arena-render-fix-v1.js','arena-view-repair-v1.js','hero-tutorial-bridge-v1.js','hero-skill-visibility-v1.js']:
              if obsolete in scripts:
                  failures.append(f'obsolete repair runtime loaded: {obsolete}')
          arena=Path('arena-v2.js').read_text(encoding='utf-8')
          if arena.count('window.arena=') != 1:
              failures.append('arena-v2.js must publish exactly one canonical window.arena renderer')
          hero=Path('hero-dashboard-v8.js').read_text(encoding='utf-8')
          if 'removeDuplicateSkills' not in hero or 'normalizeTabs' not in hero:
              failures.append('hero-dashboard-v8.js must own tab and duplicate-skill normalization')
          if failures:
              raise SystemExit('Runtime ownership regression:\n'+'\n'.join(failures))
          print('Release runtime ownership is consolidated.')
          PY

      - name: Guard reincarnation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          canonical=Path('reincarnation-v1.js').read_text(encoding='utf-8')
          adapter=Path('shrine-runtime-v2.js').read_text(encoding='utf-8')
          failures=[]
          for needle in ['createRecoverySnapshot','keys:0',"emit?.('reincarnated'",'requestReincarnation']:
              if needle not in canonical:
                  failures.append(f'reincarnation-v1.js missing invariant: {needle}')
          if 'api.requestReincarnation' not in adapter:
              failures.append('shrine-runtime-v2.js must delegate reincarnation to canonical API')
          for forbidden in ['Object.keys(S).forEach','keys:S.keys','keys:S.keys||','S.keys||0']:
              if forbidden in adapter:
                  failures.append(f'shrine-runtime-v2.js reintroduces duplicate reset authority: {forbidden}')
          if 'api.bonuses?.(S)' not in adapter:
              failures.append('shrine-runtime-v2.js must consume complete canonical legacy bonuses')
          if failures:
              raise SystemExit('Reincarnation invariant regression:\n'+'\n'.join(failures))
          print('Reincarnation invariants are intact.')
          PY
